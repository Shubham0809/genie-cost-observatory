bundle:
  name: genie-cost-observatory

variables:
  app_name:
    description: Databricks App name
    default: genie-cost-observatory
  sql_warehouse_id:
    description: SQL warehouse ID bound to the app as sql-warehouse
  databricks_account_id:
    description: Databricks account ID used by the read-only Budget API. scripts/deploy.sh looks this up from system.billing.usage during deploy.
  databricks_account_host:
    description: Databricks account console host. scripts/deploy.sh derives this from the destination workspace URL during deploy.

resources:
  apps:
    app:
      name: ${var.app_name}
      description: Account-wide Genie cost observability with workspace and identity drill-down
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true

      config:
        command: ['npm', 'run', 'start']
        env:
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: DATABRICKS_ACCOUNT_ID
            value: ${var.databricks_account_id}
          - name: DATABRICKS_ACCOUNT_HOST
            value: ${var.databricks_account_host}

      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE

targets:
  # Host and credentials come from the selected Databricks CLI profile, not from this file.
  default:
    default: true

  customer:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
